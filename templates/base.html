<!doctype html>
<!-- Общий каркас страниц: навигация, сообщения об ошибках и защита формы выхода. -->
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Личный кабинет{% endblock %} · Workspace</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><a class="brand" href="/">W<span>Workspace</span></a><span class="badge">Внутренний сервис</span>{% if g.user %}<form action="{{ url_for('auth.logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="secondary">Выйти</button></form>{% endif %}</header>
<main>{% for category, message in get_flashed_messages(with_categories=true) %}<div class="notice {{ category }}" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>Личное пространство для ваших данных · <span data-timezone>Время в UTC; включите JavaScript для местного времени</span></footer><script type="module" src="{{ url_for('static', filename='time.mjs') }}"></script></body></html>
